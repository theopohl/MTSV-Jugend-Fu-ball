<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0F3B26" />
<title>Trainer – MTSV Hohenwestedt Jugend</title>
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
<link rel="icon" href="assets/icons/icon-192.png" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link
  href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Saira+Condensed:wght@400;600;700;900&display=swap"
  rel="stylesheet"
/>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<script src="config.js"></script>
<script>window.GATE_MODE = "trainer";</script>
<script src="js/gate.js"></script>

<header class="app-header">
  <img src="assets/mtsv-logo.png" alt="MTSV" />
  <h1>Trainer-Eingabe</h1>
  <nav>
    <a href="index.html">Generator</a>
    <a href="trainer.html" class="active">Trainer</a>
  </nav>
</header>

<main>
  <section class="card" id="teamSection">
    <h2>Mannschaft</h2>
    <div class="chip-list" id="teamChips"></div>
  </section>

  <section class="card" id="nextMatchCard">
    <h2>Nächstes Spiel</h2>
    <div id="nextMatchInfo" class="hint">Lade…</div>
  </section>

  <section class="card" id="resultCard" style="display:none;">
    <h2>Ergebnis eintragen</h2>
    <div class="row">
      <div class="field">
        <label>Tore MTSV</label>
        <input type="number" id="ownGoals" min="0" value="0" />
      </div>
      <div class="field">
        <label>Tore Gegner</label>
        <input type="number" id="oppGoals" min="0" value="0" />
      </div>
    </div>

    <label>Torschützen</label>
    <p class="hint">
      Jugendschutz: Bei U16 bitte nur Vorname oder Trikotnummer eintragen, keinen vollen Nachnamen.
    </p>
    <div id="scorerRows"></div>
    <button type="button" id="addScorerBtn" class="secondary">+ Torschütze</button>

    <div class="field" style="margin-top:16px;">
      <label>Notiz (optional)</label>
      <textarea id="resultNote" rows="2"></textarea>
    </div>

    <button type="button" id="saveResultBtn" style="margin-top:12px;">Ergebnis speichern</button>
    <div id="saveResultMsg" class="hint"></div>
  </section>

  <section class="card">
    <h2>Kommende Spiele</h2>
    <div class="fixture-list" id="upcomingList"></div>

    <h3 style="margin-top:24px;">Neues Spiel anlegen</h3>
    <form id="newFixtureForm">
      <div class="row">
        <div class="field">
          <label>Spieltag-Nr.</label>
          <input type="number" name="matchday" min="1" required />
        </div>
        <div class="field">
          <label>Gegner</label>
          <input type="text" name="opponent" required />
        </div>
      </div>
      <div class="row">
        <div class="field">
          <label>Datum</label>
          <input type="date" name="date" required />
        </div>
        <div class="field">
          <label>Uhrzeit</label>
          <input type="time" name="kickoff" required />
        </div>
      </div>
      <div class="row">
        <div class="field">
          <label>Heim/Auswärts</label>
          <select name="isHome">
            <option value="true">Heimspiel</option>
            <option value="false">Auswärts</option>
          </select>
        </div>
        <div class="field">
          <label>Ort (leer = Standard-Heimort)</label>
          <input type="text" name="venue" placeholder="Sportpark Wilhelmshöhe" />
        </div>
      </div>
      <button type="submit" class="secondary">Spiel anlegen</button>
    </form>
  </section>

  <section class="card">
    <h2>Mannschaftsfotos</h2>
    <div class="field">
      <label for="photoUpload">Foto hochladen</label>
      <input type="file" id="photoUpload" accept="image/*" />
    </div>
    <div class="photo-grid" id="teamPhotoGrid"></div>
  </section>

  <section class="card">
    <h2>Gegner anlegen</h2>
    <div class="field">
      <label for="opponentSelect">Gegner</label>
      <div style="display:flex; gap:8px; align-items:center;">
        <select id="opponentSelect" style="flex:1;"></select>
        <button type="button" id="refreshOpponentsBtn" class="secondary" style="flex:0 0 auto;" title="Liste neu laden">↻</button>
      </div>
    </div>
    <div class="field" id="opponentLogoPreviewField" style="display:none;">
      <label>Aktuelles Logo</label>
      <div style="display:flex; align-items:center; gap:10px;">
        <img id="opponentLogoPreview" alt="" style="display:none; height:56px; width:56px; object-fit:contain; border:1px solid var(--border); border-radius:8px; background:#fff; padding:4px;" />
        <span id="opponentLogoPreviewEmpty" class="hint" style="margin:0;">Noch kein Logo hinterlegt.</span>
      </div>
    </div>
    <div class="row">
      <div class="field" id="opponentNameField">
        <label>Name</label>
        <input type="text" id="newOpponentName" />
      </div>
      <div class="field">
        <label id="opponentLogoLabel" for="newOpponentLogo">Logo (optional)</label>
        <input type="file" id="newOpponentLogo" accept="image/*" />
      </div>
    </div>
    <button type="button" id="createOpponentBtn" class="secondary">Gegner speichern</button>
    <div id="createOpponentMsg" class="hint"></div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/db.js"></script>
<script src="js/caption.js"></script>
<script src="js/app-trainer.js"></script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => navigator.serviceWorker.register("sw.js"));
  }
</script>
</body>
</html>
